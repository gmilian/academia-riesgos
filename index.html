<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Academia Internacional de Gestión Integral de Riesgos</title>
    
    <!-- Meta-tags para PWA en iPhone / iPad (Pantalla Completa Standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Riesgos ERM" />
    <meta name="theme-color" content="#050a18" />
    
    <!-- Tailwind CSS autónomo vía CDN (funciona sin instalar nada) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: { 900: '#0a1128', 950: '#050a18' },
              gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
            }
          }
        }
      }
    </script>
    <style>
      body {
        overscroll-behavior-y: none;
        padding-bottom: env(safe-area-inset-bottom);
      }
      @media print {
        header, aside, button, .no-print { display: none !important; }
        body { background: white !important; color: black !important; }
        .bg-slate-900, .bg-slate-950 { background: transparent !important; color: black !important; border: 1px solid #cbd5e1 !important; }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
